<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Confidentiel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: #f4f0e6;
      color: #171717;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .page {
      width: 100%;
      max-width: 600px;
    }

    .confidentiel {
      color: #aa7d22;
      font-size: 13px;
      letter-spacing: 5px;
      margin-bottom: 50px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(60px, 17vw, 100px);
      font-weight: normal;
    }

    .line {
      width: 50px;
      height: 2px;
      margin: 25px auto 40px;
      background: #aa7d22;
    }

    h2 {
      margin-bottom: 30px;
      color: #aa7d22;
      font-size: 20px;
      letter-spacing: 2px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
    }

    .heart {
      margin-top: 40px;
      color: #aa7d22;
      font-size: 28px;
    }

    .small {
      margin-top: 60px;
      font-size: 11px;
      font-style: italic;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="confidentiel">
      CONFIDENTIEL — N°006
    </div>

    <h1>TROP TÔT.</h1>

    <div class="line"></div>

    <h2>JE T'AVAIS DIT DE NE PAS SCANNER. 😏</h2>

    <p>
      La réponse est bien ici.
      <br>
      Mais ce n'est pas encore le moment de la découvrir.
    </p>

    <p>
      Referme ton classeur.
      <br>
      Et attends mon message.
    </p>

    <div class="heart">♥</div>

    <div class="small">
      Oui, j'avais également prévu que tu essaierais ça.
    </div>

  </main>

</body>
</html>

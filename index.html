<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Destination débloquée</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f3eb;
            font-family: Georgia, "Times New Roman", serif;
            color: #222;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 600px;
        }

        .small {
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #a47c3c;
            margin-bottom: 35px;
        }

        h1 {
            font-size: clamp(48px, 14vw, 85px);
            font-weight: normal;
            margin: 0;
            letter-spacing: 3px;
        }

        .line {
            width: 60px;
            height: 2px;
            background: #b58b4a;
            margin: 28px auto;
        }

        .date {
            font-family: Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .message {
            margin-top: 45px;
            font-size: 18px;
            line-height: 1.7;
        }

        .heart {
            margin-top: 35px;
            font-size: 22px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="small">
        DESTINATION N°001 — DÉBLOQUÉE
    </div>

    <h1>VENISE</h1>

    <div class="line"></div>

    <div class="date">
        11 SEPTEMBRE 2026
    </div>

    <div class="message">
        Le voyage commence ici.<br>
        Et ce n'est que le début.
    </div>

    <div class="heart">
        ❤️
    </div>

</div>

</body>
</html>

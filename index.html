<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Destination</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #090909;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.container {
    text-align: center;
}

.loader {
    width: 60px;
    height: 60px;
    border: 4px solid #333;
    border-top: 4px solid #c5a15a;
    border-radius: 50%;
    margin: auto;
    animation: spin 1s linear infinite;
}

#venise {
    display: none;
    font-family: Georgia, serif;
    font-size: 60px;
    letter-spacing: 8px;
    font-weight: normal;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="container">

    <div id="loader" class="loader"></div>

    <div id="venise">
        VENISE
    </div>

</div>

<script>
setTimeout(function() {
    document.getElementById("loader").style.display = "none";
    document.getElementById("venise").style.display = "block";
}, 3000);
</script>

</body>
</html>

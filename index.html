<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chapitre 1</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: #f4f0e6;
      color: #171717;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    .page {
      width: 100%;
      max-width: 650px;
      animation: apparition 1.5s ease-out;
    }

    .chapter {
      color: #aa7d22;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 6px;
      margin-bottom: 45px;
      opacity: 0;
      animation: fade 1s ease forwards;
    }

    .small-title {
      font-size: 15px;
      letter-spacing: 4px;
      margin-bottom: 18px;
      opacity: 0;
      animation: fade 1s ease 0.8s forwards;
    }

    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(70px, 20vw, 125px);
      font-weight: normal;
      letter-spacing: 2px;
      opacity: 0;
      transform: translateY(15px);
      animation: reveal 1.4s ease 1.6s forwards;
    }

    .line {
      width: 55px;
      height: 2px;
      margin: 30px auto;
      background: #aa7d22;
      opacity: 0;
      animation: fade 1s ease 2.7s forwards;
    }

    .flag {
      font-size: 45px;
      margin: 15px 0 25px;
      opacity: 0;
      animation: fade 1s ease 3s forwards;
    }

    .date {
      color: #aa7d22;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 3px;
      opacity: 0;
      animation: fade 1s ease 3.4s forwards;
    }

    .message {
      margin-top: 40px;
      font-family: Georgia, serif;
      font-size: 20px;
      font-style: italic;
      line-height: 1.6;
      opacity: 0;
      animation: fade 1.2s ease 4s forwards;
    }

    .heart {
      margin-top: 35px;
      color: #aa7d22;
      font-size: 28px;
      opacity: 0;
      animation: fade 1s ease 4.6s forwards;
    }

    @keyframes fade {
      to {
        opacity: 1;
      }
    }

    @keyframes reveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes apparition {
      from {
        transform: scale(0.98);
      }
      to {
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="chapter">
      LE VOYAGE COMMENCE
    </div>

    <div class="small-title">
      CHAPITRE 1
    </div>

    <h1>VENEZIA.</h1>

    <div class="line"></div>

    <div class="flag">
      🇮🇹
    </div>

    <div class="date">
      11 → 12 SEPTEMBRE 2026
    </div>

    <div class="message">
      Notre voyage commence ici.
      <br>
      Et moi, je t'y attends déjà.
    </div>

    <div class="heart">
      ♥
    </div>

  </main>

</body>
</html>

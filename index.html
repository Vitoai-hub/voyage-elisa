<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Destination</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #090909;
    color: #f4efe5;
    font-family: Georgia, "Times New Roman", serif;
}

.screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
}

/* ----- INTRO ----- */

.intro {
    animation: introDisappear 1.5s ease forwards;
    animation-delay: 4.5s;
}

.intro-small {
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 5px;
    color: #b99558;
    opacity: 0;
    animation: fadeIn 1.5s ease forwards;
    animation-delay: .5s;
}

.intro-text {
    margin-top: 25px;
    font-size: 21px;
    line-height: 1.6;
    opacity: 0;
    animation: fadeIn 1.8s ease forwards;
    animation-delay: 1.8s;
}


/* ----- DESTINATION ----- */

.destination {
    opacity: 0;
    animation: destinationAppear 2s ease forwards;
    animation-delay: 6s;
}

.number {
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 5px;
    color: #b99558;
    opacity: 0;
    animation: fadeIn 1.5s ease forwards;
    animation-delay: 6.5s;
}

h1 {
    margin: 22px 0 0;
    font-weight: normal;
    font-size: clamp(55px, 18vw, 100px);
    letter-spacing: 8px;

    opacity: 0;
    filter: blur(15px);
    transform: scale(.94);

    animation: revealCity 3.5s ease forwards;
    animation-delay: 7.5s;
}

.line {
    width: 0;
    height: 1px;
    margin: 25px auto;
    background: #b99558;

    animation: drawLine 1.5s ease forwards;
    animation-delay: 10.5s;
}

.date {
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 4px;

    opacity: 0;
    animation: fadeIn 1.5s ease forwards;
    animation-delay: 11s;
}

.final {
    margin-top: 40px;
    font-size: 17px;
    line-height: 1.7;

    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 12.5s;
}

.heart {
    margin-top: 30px;
    opacity: 0;
    animation: fadeIn 2s ease forwards;
    animation-delay: 14s;
}


/* ----- ANIMATIONS ----- */

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
}

@keyframes introDisappear {
    to {
        opacity: 0;
        transform: scale(1.03);
        visibility: hidden;
    }
}

@keyframes destinationAppear {
    to { opacity: 1; }
}

@keyframes revealCity {
    0% {
        opacity: 0;
        filter: blur(15px);
        letter-spacing: 20px;
        transform: scale(.94);
    }

    100% {
        opacity: 1;
        filter: blur(0);
        letter-spacing: 8px;
        transform: scale(1);
        text-shadow: 0 0 35px rgba(185,149,88,.18);
    }
}

@keyframes drawLine {
    to { width: 75px; }
}

</style>
</head>

<body>

<!-- INTRO -->
<div class="screen intro">

    <div class="intro-small">
        5 ANS · 17 JOURS · 2 SACS À DOS
    </div>

    <div class="intro-text">
        Tu voulais savoir où tout commence…
    </div>

</div>


<!-- RÉVÉLATION -->
<div class="screen destination">

    <div class="number">
        DESTINATION 01
    </div>

    <h1>VENISE</h1>

    <div class="line"></div>

    <div class="date">
        11 SEPTEMBRE 2026
    </div>

    <div class="final">
        Ton voyage commence ici.<br>
        La suite ne t'appartient toujours pas.
    </div>

    <div class="heart">❤️</div>

</div>

</body>
</html>
